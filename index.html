<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved</title>
<script>
  // Project sites that moved from crvouga-organization to crvouga.
  // Forward /<repo>/<rest> to the same path there, keeping query and hash.
  var moved = [];
  var parts = location.pathname.split("/");
  var repo = (parts[1] || "").toLowerCase();
  location.replace(moved.indexOf(repo) >= 0
    ? "https://crvouga.github.io" + location.pathname + location.search + location.hash
    : "https://github.com/crvouga");
</script>
</head>
<body><p>Moved to <a href="https://github.com/crvouga">github.com/crvouga</a>.</p></body>
</html>
